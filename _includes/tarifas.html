<!-- ******tarifas****** -->
<section id="planes" class="tarifas section">

<style>
  #planes {
    background: var(--blue); color: #fff;
    --brand:       #eebf3f;
    --brand-dim:   #d4a82e;
    --brand-soft:  rgba(238,191,63,.12);
    --card-bg:     #ffffff;
    --card-border: rgba(255,255,255,.20);
    --input-bg:    #f9f9f9;
    --input-border:#d0d0d0;
    --text:        rgba(255,255,255,.88);
    --text-strong: #fff;
    --muted:       rgba(255,255,255,.70);
    --muted-2:     rgba(255,255,255,.55);
    --font-head:   'Montserrat', sans-serif;
    --font-body:   'Lato', sans-serif;
    --radius-sm:   6px;
    --radius-md:   12px;
    --radius-lg:   20px;
    --radius-xl:   32px;
    --transition:  0.22s cubic-bezier(.4,0,.2,1);
  }

  #planes .precios-header {
    margin-bottom: 40px;
    text-align: center;
  }

  #planes .section-label {
    font-family: var(--font-head);
    font-size: .75rem;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--brand);
    margin-bottom: 12px;
  }

  #planes .section-title {
    font-family: var(--font-head);
    font-size: clamp(1.6rem, 3vw, 2.4rem);
    font-weight: 700;
    line-height: 1.2;
    color: var(--text-strong);
    margin-bottom: 12px;
  }

  #planes .section-sub {
    font-size: .95rem;
    color: var(--muted);
    max-width: 600px;
    line-height: 1.7;
    margin: 0 auto 20px;
  }

  #planes .precios-selector {
    display: flex;
    gap: 0;
    margin: 0 auto 32px;
    background: rgba(255,255,255,.15);
    border-radius: var(--radius-lg);
    padding: 4px;
    width: fit-content;
  }

  #planes .pais-btn {
    padding: 10px 24px;
    border-radius: var(--radius-md);
    font-family: var(--font-head);
    font-weight: 600;
    font-size: .875rem;
    color: rgba(255,255,255,.70);
    transition: var(--transition);
    cursor: pointer;
    border: none;
    background: none;
  }

  #planes .pais-btn.active {
    background: rgba(255,255,255,.20);
    color: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.15);
  }

  #planes .precios-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
    margin-bottom: 36px;
    max-width: 360px;
    margin-left: auto;
    margin-right: auto;
  }

  #planes .precio-card {
    --text:        #444;
    --text-strong: #222;
    --muted:       #777;
    --muted-2:     #555;
    --card-border: #e0e0e0;
    padding: 28px 24px;
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    background: var(--card-bg);
    transition: var(--transition);
    position: relative;
  }

  #planes .precio-card:hover {
    border-color: var(--brand);
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
  }

  #planes .precio-tipo {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 1rem;
    color: var(--text-strong);
    margin-bottom: 4px;
  }

  #planes .precio-desc {
    font-size: .82rem;
    color: var(--muted);
    margin-bottom: 20px;
  }

  #planes .precio-tabla {
    width: 100%;
    border-collapse: collapse;
  }

  #planes .precio-tabla th {
    font-size: .72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    padding: 0 0 10px;
    text-align: left;
  }

  #planes .precio-tabla td {
    padding: 10px 0;
    border-top: 1px solid var(--card-border);
    font-size: .9rem;
    color: var(--text);
  }

  #planes .precio-tabla td:last-child {
    text-align: right;
    font-weight: 600;
    color: var(--text-strong);
  }

  #planes .precio-tabla tr.plan-row {
    cursor: pointer;
    transition: var(--transition);
  }

  #planes .precio-tabla tr.plan-row:hover td {
    color: var(--brand-dim);
  }

  #planes .precio-tabla tr.plan-row td:first-child::before {
    content: '○ ';
    color: var(--muted-2);
  }

  #planes .precio-tabla tr.plan-row.selected td {
    color: var(--brand-dim);
    font-weight: 700;
  }

  #planes .precio-tabla tr.plan-row.selected td:first-child::before {
    content: '● ';
    color: var(--brand-dim);
  }

  #planes .precio-moneda {
    font-size: .75rem;
    color: var(--muted);
  }

  #planes .precios-ctas {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
  }

  #planes .calc-cta-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 28px;
    border-radius: var(--radius-lg);
    font-family: var(--font-head);
    font-weight: 600;
    font-size: .95rem;
    letter-spacing: .01em;
    transition: var(--transition);
    white-space: nowrap;
    background: var(--brand);
    color: var(--blue-dark);
    border: 2px solid var(--brand);
    cursor: pointer;
  }

  #planes .calc-cta-btn:hover {
    background: var(--brand-dim);
    border-color: var(--brand-dim);
    transform: translateY(-1px);
  }

  #planes .btn-ghost {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 28px;
    border-radius: var(--radius-lg);
    font-family: var(--font-head);
    font-weight: 600;
    font-size: .95rem;
    letter-spacing: .01em;
    transition: var(--transition);
    white-space: nowrap;
    background: transparent;
    color: var(--text);
    border: 1.5px solid var(--card-border);
    cursor: pointer;
    text-decoration: none;
  }

  #planes .btn-ghost:hover {
    border-color: var(--muted-2);
    background: var(--input-bg);
    color: var(--blue-dark);
    transform: translateY(-1px);
  }
</style>

<div class="container">
  <div class="tarifas-inner">

    <div class="precios-header">
      <p class="section-label">Planes</p>
      <h2 class="section-title">Una inversión que<br>se paga con un solo cierre</h2>
      <p class="section-sub">Suscripción prepago individual, sin mensualidad automática. Elegí la duración que más te convenga.</p>
    </div>

    <!-- Selector de país -->
    <div class="precios-selector" role="group" aria-label="Seleccionar país">
      <button class="pais-btn active" data-pais="bolivia" onclick="tarifasSetPais(this)">🇧🇴 Bolivia (Bs.)</button>
      <button class="pais-btn" data-pais="peru" onclick="tarifasSetPais(this)">🇵🇪 Perú (S/.)</button>
    </div>

    <!-- Grid de precios -->
    <div class="precios-grid" id="precios-grid">
      <!-- Generado dinámicamente por JS -->
    </div>

    <div class="precios-ctas">
      <button class="calc-cta-btn" id="calc-cta-btn" onclick="tarifasIrAlFormulario()">
        <span id="calc-cta-txt">Quiero este plan</span>
      </button>
      <a href="#" id="calc-wa-link" onclick="tarifasAbrirWhatsApp(event)" target="_blank" rel="noopener" class="btn-ghost">
        Consultar por WhatsApp →
      </a>
    </div>

  </div><!--//tarifas-inner-->
</div><!--//container-->

<script>
/* ============================================================
   PRECIOS — datos
   ============================================================ */
var TARIFAS_PRECIOS = {
  bolivia: {
    moneda: 'Bs.',
    codigo: 'BOB',
    individual: { 30: 100, 90: 249, 180: 396 }
  },
  peru: {
    moneda: 'S/.',
    codigo: 'PEN',
    individual: { 30: 35, 90: 90, 180: 144 }
  }
};

var TARIFAS_PAIS = 'bolivia';
var TARIFAS_DURACION = 90;
var TARIFAS_PLAN_MSG = '';

/* ============================================================
   Render de precios
   ============================================================ */
function tarifasRenderPrecios() {
  var p = TARIFAS_PRECIOS[TARIFAS_PAIS];
  var grid = document.getElementById('precios-grid');
  var duraciones = [30, 90, 180];

  var html = '<div class="precio-card">';
  html += '<div class="precio-tipo">Individual</div>';
  html += '<div class="precio-desc">Para el agente independiente</div>';
  html += '<table class="precio-tabla"><thead><tr><th>Duraci\u00f3n</th><th style="text-align:right">Total</th></tr></thead><tbody>';
  for (var d = 0; d < duraciones.length; d++) {
    var dur = duraciones[d];
    var sel = dur === TARIFAS_DURACION ? ' selected' : '';
    html += '<tr class="plan-row' + sel + '" data-duracion="' + dur + '" onclick="tarifasSetDuracion(' + dur + ')">' +
      '<td>' + dur + ' d\u00edas</td><td>' + p.moneda + ' ' + p.individual[dur].toLocaleString() + '</td></tr>';
  }
  html += '</tbody></table></div>';

  grid.innerHTML = html;

  tarifasActualizarPlanMsg();
}

/* ============================================================
   Selección de duración
   ============================================================ */
function tarifasSetDuracion(dias) {
  TARIFAS_DURACION = dias;
  var filas = document.querySelectorAll('#planes .plan-row');
  for (var i = 0; i < filas.length; i++) {
    filas[i].classList.toggle('selected', parseInt(filas[i].getAttribute('data-duracion')) === dias);
  }
  tarifasActualizarPlanMsg();
}

/* ============================================================
   Mensaje y texto de CTA según el plan seleccionado
   ============================================================ */
function tarifasActualizarPlanMsg() {
  var p = TARIFAS_PRECIOS[TARIFAS_PAIS];
  var precio = p.individual[TARIFAS_DURACION];

  TARIFAS_PLAN_MSG = 'Estoy interesado en el plan individual de ' + TARIFAS_DURACION + ' d\u00edas (' +
    p.moneda + ' ' + precio.toLocaleString() + ').';

  var ctaTxt = document.getElementById('calc-cta-txt');
  if (ctaTxt) {
    ctaTxt.textContent = 'Quiero el plan de ' + TARIFAS_DURACION + ' d\u00edas \u2014 ' + p.moneda + ' ' + precio.toLocaleString();
  }
}

/* ============================================================
   Selector de país
   ============================================================ */
function tarifasSetPais(btn) {
  var btns = document.querySelectorAll('#planes .pais-btn');
  for (var i = 0; i < btns.length; i++) { btns[i].classList.remove('active'); }
  btn.classList.add('active');
  TARIFAS_PAIS = btn.getAttribute('data-pais');

  /* Sincronizar el selector del formulario */
  var formPais = document.getElementById('f-pais');
  if (formPais) {
    formPais.value = TARIFAS_PAIS;
    var evt = document.createEvent('HTMLEvents');
    evt.initEvent('change', true, true);
    formPais.dispatchEvent(evt);
  }

  tarifasRenderPrecios();
}

/* ============================================================
   Abrir WhatsApp con el plan seleccionado
   ============================================================ */
function tarifasAbrirWhatsApp(evt) {
  evt.preventDefault();
  window.open('https://wa.me/59178447518?text=' + encodeURIComponent(TARIFAS_PLAN_MSG), '_blank');
}

/* ============================================================
   Ir al formulario con el plan seleccionado
   ============================================================ */
function tarifasIrAlFormulario() {
  var campo = document.getElementById('f-mensaje');
  if (campo && TARIFAS_PLAN_MSG) { campo.value = TARIFAS_PLAN_MSG; }
  var formSection = document.getElementById('Contacto');
  if (formSection) {
    formSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  setTimeout(function() { if (campo) campo.focus(); }, 600);
}

/* ============================================================
   Init
   ============================================================ */
tarifasRenderPrecios();

/* Sync: cuando cambia el país en el formulario, actualiza la sección precios */
(function() {
  var paisSelector = document.getElementById('f-pais');
  if (paisSelector) {
    paisSelector.addEventListener('change', function() {
      TARIFAS_PAIS = this.value;
      tarifasRenderPrecios();
      var btns = document.querySelectorAll('#planes .pais-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.toggle('active', btns[i].getAttribute('data-pais') === TARIFAS_PAIS);
      }
    });
  }
})();
</script>

</section>
