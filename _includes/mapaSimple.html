<!-- La home es el mapa (/); las secciones viven en la landing (/ai/).
     Un fragmento nunca llega al servidor, así que el reenvío tiene que ser
     del lado del cliente. Va primero en el include para ejecutarse antes de
     que se inicialice el mapa. -->
<script>
(function () {
  var SECCIONES = { inicio: 1, problema: 1, testimonios: 1, funciones: 1,
                    planes: 1, prensa: 1, faq: 1, blog: 1, contacto: 1 };
  var ID = { contacto: 'Contacto' };
  function aLaLanding() {
    var h = location.hash.slice(1).toLowerCase();
    if (SECCIONES[h] !== 1) return;      // !== 1 evita heredar Object.prototype
    location.replace('/ai/#' + (ID[h] || h));
  }
  addEventListener('hashchange', aLaLanding);   // clics en la nav del header
  aLaLanding();                                 // altas con /#planes pegado
})();
</script>

<style>
  /* .header es position:fixed con 64px: el mapa arranca debajo. */
  /* Mapa fijo a pantalla completa: llega siempre al borde inferior visible.
     El header (fixed) flota encima y se oculta subiendo al hacer zoom in. */
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  #mapid {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    width: auto; height: auto; margin: 0; z-index: 1;
  }
  #header { z-index: 1200; transition: transform .35s ease; }
  body.header-oculto #header { transform: translateY(-110%); }
  /* Controles de Leaflet (zoom +/-) bajan 64px mientras el header está visible */

  body.header-oculto .leaflet-top { margin-top: 0; }
  @media (prefers-reduced-motion: reduce) {
    #header, .leaflet-top { transition: none; }
  }

  /* Posiciones de la caja (fixed = relativa a la pantalla visible):
     inicio: centro vertical | .abajo: pegada a la base (tras buscar o dibujar). */

  @media (prefers-reduced-motion: reduce) { #caja { transition: none; } }
  #caja form { display: flex; gap: 8px; }

  #caja form { flex-wrap: wrap; }

  /* buddy: en esta página solo va el mapa. Estos elementos los crea el JS al vuelo

  /* ---------- Toolbox del modo agente (⚙): drawer derecho que baja del
     header fijo de 64px. El botón nace display:none (inline) y mapa.js lo
     muestra solo con usuario.hasTime quitando el inline → cae en el flex
     de esta regla. */
  #toolbox-btn {
    position: fixed; top: 74px; right: 10px; z-index: 1250;
    width: 44px; height: 44px; padding: 0;
    background: #fff; border: 1px solid #d5dde2; border-radius: 50%;
    color: #074f66; font-size: 20px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(7, 79, 102, .18);
    transition: background .2s ease, transform .2s ease, right .25s ease;
  }
  #toolbox-btn:hover { background: #f2f9fc; transform: translateY(-1px); }
  #toolbox-btn:focus-visible { outline: 2px solid #17baef; outline-offset: 2px; }
  /* Abierto: el ⚙ acompaña al drawer y se corre a su borde izquierdo, para no
     tapar el ✕ del header del panel (coinciden en la esquina si no se mueve). */
  #toolbox-btn[aria-expanded="true"] {
    background: #17baef; color: #fff; border-color: #17baef;
    right: calc(360px + 10px);
  }
  /* Backdrop: solo pantallas chicas. Le da affordance al "tap fuera cierra"
     (antes era acertarle a la franja de mapa que asomaba). */
  #toolbox-backdrop {
    position: fixed; inset: 0; z-index: 1240;
    background: rgba(0, 0, 0, .35);
    opacity: 0; visibility: hidden; display: none;
    transition: opacity .25s ease, visibility .25s;
  }
  #toolbox-backdrop.open { opacity: 1; visibility: visible; }
  @media (max-width: 767px) { #toolbox-backdrop { display: block; } }

  /* El panel nunca usa display:none: vive renderizado y entra/sale con
     transform → ancho FIJO (ya no shrink-to-fit: no salta con el contenido,
     con el modo "solo" de menuIcons ni con las secciones que se montan
     tarde). z-index por debajo del ⚙ para que el botón siga clicable con
     el panel abierto. */
  #toolbox {
    position: fixed; top: 64px; right: 0;
    width: 360px; max-width: 100vw;
    height: calc(100vh - 64px); max-height: calc(100vh - 64px);
    overflow-y: auto; overscroll-behavior: contain;
    background: #fff; border-left: 1px solid #e3e8ec;
    box-shadow: -8px 0 30px rgba(7, 79, 102, .12);
    z-index: 1245;
    transform: translateX(105%); visibility: hidden;
    transition: transform .25s ease, visibility .25s;
  }
  #toolbox.open { transform: translateX(0); visibility: visible; }
  /* En celular el panel deja una franja de mapa visible y clicable. */
  @media (max-width: 767px) { #toolbox { width: min(320px, 86vw); } }

  /* Cabecera propia del panel, sticky: el ✕ queda a mano con scroll. */
  #toolbox .tb-head {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 8px 10px 16px; background: #fff;
    border-bottom: 1px solid #e9eef1;
  }
  #toolbox .tb-head h2 {
    margin: 0; font-size: .95rem; font-weight: 700; color: #074f66;
  }
  #toolbox .tb-close {
    margin-left: auto; width: 40px; height: 40px; padding: 0;
    border: 0; border-radius: 8px; background: none; cursor: pointer;
    font-size: 20px; line-height: 1; color: #5a6b74;
    display: flex; align-items: center; justify-content: center;
  }
  #toolbox .tb-close:hover { background: #f0f4f6; color: #074f66; }
  #toolbox .tb-close:focus-visible { outline: 2px solid #17baef; }

  /* En celular el ⚙ no se mueve (a la izquierda pisaría los controles de zoom
     de Leaflet): queda sobre la esquina del panel como handle flotante, y el
     header reserva espacio para que el ✕ no quede debajo. Este bloque va
     DESPUÉS de las reglas base: misma especificidad → gana el orden. */
  @media (max-width: 767px) {
    #toolbox-btn[aria-expanded="true"] { right: 10px; }
    #toolbox .tb-head { padding-right: 56px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #toolbox, #toolbox-btn, #toolbox-backdrop { transition: none; }
  }

  #toolbox .search-container { display: flex; align-items: center; margin-bottom: 10px; }
  #toolbox .search-container span { margin-right: 5px; font-size: 16px; }
  #toolbox .search-container input { flex: 1; padding: 3px 5px; }

  .check-overlay {
    font-size: 18px; color: green; font-weight: bold;
    text-shadow: 1px 1px 2px #fff;
  }

  #loading-indicator {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255, 255, 255, 0.9);
    padding: 10px 20px; border-radius: 8px;
    font-weight: bold; display: none; z-index: 2000;
  }
  /* Escopetado a #toolbox: el tema del sitio (theme-*.css, main.css) tiene
     reglas globales .section { padding: 80px 0 } y .section-header
     { text-align:center; margin-bottom:4rem } que rompen el panel. */
  #toolbox .section { border-bottom: 1px solid #eef2f4; padding: 0; margin: 0; }
  #toolbox .section-header {
    cursor: pointer; font-weight: 600; font-size: .92rem; color: #2b3a42;

  #toolbox .section-body { display: none; padding: 4px 16px 16px; }
  #toolbox .section.active .section-body { display: block; }

  /* Chevron de colapsar (lo crea mapa.js en cada .section-header): siempre
     visible a la derecha, gira cuando la sección está abierta. */
  #toolbox .section-collapse {
    margin-left: auto; border: 0; background: transparent;
    font-size: 14px; line-height: 1; cursor: pointer;
    color: #9db0b9; flex-shrink: 0; padding: 4px 6px;

<script>
// ---------- Centro inicial del mapa: URL > localStorage > geo IP > SCZ ----------
// Bloque aparte (mismo patrón que el shim de arriba): la lógica de resolución es
// pura y se prueba con stubs en scripts/mapa-home-geo.test.js.
var STT_GEO = (function () {
  var CENTRO_DEF = [-17.7833281, -63.1821673];   // Santa Cruz de la Sierra
  var ZOOM_DEF = 12;

  // Portada por país: espejo de paises.defaultCiudad del backend (config.js).
  var PAISES = {
    bo: { lat: -17.7833281, lng: -63.1821673, z: 12 },   // Santa Cruz de la Sierra
    pe: { lat: -12.09533,   lng: -77.05398,   z: 12 }    // Lima
  };
  var ALIAS_PAIS = { bolivia: 'bo', peru: 'pe' };

  // Tabla corta para ?ciudad=<slug>: links legibles para campañas y compartidos.
  var CIUDADES = {
    'santa-cruz':  { lat: -17.7833, lng: -63.1821, z: 12 },
    'la-paz':      { lat: -16.4897, lng: -68.1193, z: 12 },
    'el-alto':     { lat: -16.5047, lng: -68.1864, z: 12 },
    'cochabamba':  { lat: -17.3895, lng: -66.1568, z: 12 },
    'sucre':       { lat: -19.0196, lng: -65.2619, z: 13 },
    'oruro':       { lat: -17.9833, lng: -67.1500, z: 13 },
    'potosi':      { lat: -19.5836, lng: -65.7531, z: 13 },
    'tarija':      { lat: -21.5355, lng: -64.7296, z: 13 },
    'trinidad':    { lat: -14.8333, lng: -64.9000, z: 13 },
    'cobija':      { lat: -11.0267, lng: -68.7692, z: 13 },
    'montero':     { lat: -17.3386, lng: -63.2550, z: 13 },
    'quillacollo': { lat: -17.3922, lng: -66.2783, z: 13 },
    'lima':        { lat: -12.0464, lng: -77.0428, z: 12 },
    'arequipa':    { lat: -16.4090, lng: -71.5375, z: 12 },
    'trujillo':    { lat:  -8.1116, lng: -79.0287, z: 12 },
    'chiclayo':    { lat:  -6.7714, lng: -79.8410, z: 12 },
    'cusco':       { lat: -13.5320, lng: -71.9675, z: 13 },
    'piura':       { lat:  -5.1945, lng: -80.6328, z: 12 },
    'iquitos':     { lat:  -3.7437, lng: -73.2516, z: 12 },
    'huancayo':    { lat: -12.0653, lng: -75.2049, z: 12 },
    'tacna':       { lat: -18.0146, lng: -70.2536, z: 12 }
  };
  var ALIAS_CIUDAD = {
    'santa-cruz-de-la-sierra': 'santa-cruz', scz: 'santa-cruz', lpz: 'la-paz',
    cbb: 'cochabamba', tja: 'tarija', oru: 'oruro', lim: 'lima',
    aqp: 'arequipa', cuzco: 'cusco'
  };

  function slug(s) {
    return String(s == null ? '' : s).toLowerCase().trim()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[\s_]+/g, '-');
  }
  function zoomOk(z) {
    z = parseInt(z, 10);
    return isFinite(z) ? Math.min(Math.max(z, 1), 19) : ZOOM_DEF;
  }
  function pais(sl) {
    sl = ALIAS_PAIS[sl] || sl;
    return PAISES[sl] || null;
  }
  function ciudad(sl) {
    sl = ALIAS_CIUDAD[sl] || sl;
    return CIUDADES[sl] || null;
  }

  // ?lat&lng(&z|zoom) > ?ciudad > ?pais. Pais sin cobertura → vista de los
  // dos mercados con inventario (cobertura). Devuelve null si nada aplica.
  function porQuery(search) {
    var q;
    try { q = new URLSearchParams(search || ''); } catch (e) { return null; }
    var lat = parseFloat(q.get('lat')), lng = parseFloat(q.get('lng'));
    if (isFinite(lat) && isFinite(lng)) {
      return { centro: [lat, lng], zoom: zoomOk(q.get('z') || q.get('zoom')), fuente: 'url' };
    }
    var c = ciudad(slug(q.get('ciudad')));
    if (c) return { centro: [c.lat, c.lng], zoom: c.z, fuente: 'url' };
    var p = slug(q.get('pais'));
    if (!p) return null;
    var g = pais(p);
    return g ? { centro: [g.lat, g.lng], zoom: g.z, fuente: 'url' }
             : { cobertura: true, fuente: 'url' };
  }

  // Mismas keys que assets/js/mapa.js: / y /maps/find/ comparten posición.
  function guardado(storage) {
    try {
      var c = JSON.parse(storage.getItem('mapCenter'));
      var z = parseInt(storage.getItem('mapZoom'), 10);
      if (Array.isArray(c) && isFinite(c[0]) && isFinite(c[1]) && isFinite(z)) {
        return { centro: c, zoom: z, fuente: 'local' };
      }
    } catch (e) {}
    return null;
  }

  // Cajas de los mercados para saber a qué país pertenece una posición guardada.
  // Sin esto, quien alguna vez dejó el mapa en SCZ quedaba atascado ahí aunque
  // estuviera en Perú: la memoria mandaba sobre el geo sin verificar el país.
  var BBOX_MERCADO = {
    bo: { latMin: -23.1, latMax: -9.5, lngMin: -69.7, lngMax: -57.4 },
    pe: { latMin: -18.6, latMax: 0.1, lngMin: -81.4, lngMax: -68.6 }
  };
  function paisDeCentro(c) {
    if (!Array.isArray(c)) return null;
    for (var k in BBOX_MERCADO) {
      var b = BBOX_MERCADO[k];
      if (c[0] >= b.latMin && c[0] <= b.latMax && c[1] >= b.lngMin && c[1] <= b.lngMax) return k;
    }
    return null;
  }
  // La posición guardada solo manda dentro del mismo país del visitante:
  // países distintos → el geo corrige (SCZ guardado + visitante en Perú = LIM).
  function debeCorregir(memoria, paisVisitante) {
    if (!memoria || !paisVisitante) return false;
    return paisDeCentro(memoria.centro) !== String(paisVisitante).toLowerCase();
  }

  // Respuesta de GET /api/statetty/geo → destino del mapa (o null → probar trace).
  function desdeGeo(g) {
    if (!g || typeof g !== 'object') return null;
    var lat = parseFloat(g.lat), lng = parseFloat(g.lng);
    if (isFinite(lat) && isFinite(lng)) return { centro: [lat, lng], zoom: ZOOM_DEF, fuente: 'geo', pais: slug(g.pais) || null };
    var p = slug(g.pais);
    if (!p) return null;
    var c = pais(p);
    return c ? { centro: [c.lat, c.lng], zoom: c.z, fuente: 'geo', pais: p }
             : { cobertura: true, fuente: 'geo', pais: p };
  }

  // Texto plano de /cdn-cgi/trace (loc=XX) → mismo destino que desdeGeo.
  function desdeTrace(texto) {
    var m = /loc=([A-Za-z]{2})/.exec(String(texto || ''));
    if (!m) return null;
    var p = slug(m[1]);
    var c = pais(p);
    return c ? { centro: [c.lat, c.lng], zoom: c.z, fuente: 'geo', pais: p }
             : { cobertura: true, fuente: 'geo', pais: p };
  }

  // Resolución síncrona al cargar: URL > localStorage > default.
  function inicial(search, storage) {
    var r = porQuery(search) || (storage && guardado(storage));
    if (r) return r;
    return { centro: CENTRO_DEF, zoom: ZOOM_DEF, fuente: 'default' };
  }

  // Las dos ciudades con inventario: encuadre para visitantes de otros países.
  function cobertura() {
    return [[PAISES.bo.lat, PAISES.bo.lng], [PAISES.pe.lat, PAISES.pe.lng]];
  }

  return {

  };
})();
