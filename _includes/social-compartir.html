<div id="share-box">
  <h3>Compártelo:</h3>
  <a href="https://www.facebook.com/sharer/sharer.php?u={{ site.url }}{{ site.baseurl }}{{ page.url }}" onclick="window.open(this.href, 'mywin','left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); return false;" aria-label="Compartir en Facebook">
    <i class="fab fa-facebook" aria-hidden="true"></i>
  </a>
  <a href="https://api.whatsapp.com/send?text={{ page.title | uri_escape }}%20{{ site.url }}{{ site.baseurl }}{{ page.url }}" onclick="window.open(this.href, 'mywin','left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); return false;" aria-label="Compartir en WhatsApp">
    <i class="fab fa-whatsapp" aria-hidden="true"></i>
  </a>
  <a href="https://twitter.com/intent/tweet?text={{ page.title | uri_escape }}&url={{ site.url }}{{ site.baseurl }}{{ page.url }}" onclick="window.open(this.href, 'mywin','left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); return false;" aria-label="Compartir en X">
    <i class="fab fa-twitter" aria-hidden="true"></i>
  </a>
  <a href="https://www.reddit.com/submit?url={{ site.url }}{{ site.baseurl }}{{ page.url }}" onclick="window.open(this.href, 'mywin','left=20,top=20,width=900,height=500,toolbar=1,resizable=0'); return false;" aria-label="Compartir en Reddit">
    <i class="fab fa-reddit" aria-hidden="true"></i>
  </a>
  <a href="https://www.linkedin.com/shareArticle?mini=true&url={{ site.url }}{{ site.baseurl }}{{ page.url }}&title={{ page.title | uri_escape }}" onclick="window.open(this.href, 'mywin','left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); return false;" aria-label="Compartir en LinkedIn">
    <i class="fab fa-linkedin" aria-hidden="true"></i>
  </a>
  <a href="mailto:?subject={{ page.title | uri_escape }}&body={{ site.url }}{{ site.baseurl }}{{ page.url }}" aria-label="Compartir por correo">
    <i class="fas fa-envelope" aria-hidden="true"></i>
  </a>
</div>
