<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buddy — Página de prueba</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #222;
      overflow: hidden;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem;
      box-sizing: border-box;
    }

    .test-card {
      max-width: 680px;
      padding: 2rem;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .08);
    }

    h1 {
      margin-top: 0;
    }

    code {
      padding: .15rem .35rem;
      border-radius: 4px;
      background: #eee;
    }
  </style>
</head>

<body>
  <main>
    <section class="test-card">
      <h1>Prueba de Buddy</h1>
    </section>
  </main>

  <script
    src="buddy.js?v=4"
    defer>
  </script>
</body>
</html>
